# ==============================================================
# RAILWAY PRODUCTION CONFIGURATION
# ==============================================================
# Este perfil se activa automáticamente en Railway
# Las variables de entorno se configuran en el dashboard de Railway

# ==============================================================
# SERVIDOR
# ==============================================================
# Railway asigna el puerto dinámicamente
server.port=${PORT:8080}
server.error.include-message=always

# ==============================================================
# NOMBRE DE LA APLICACIÓN
# ==============================================================
spring.application.name=dulcecontrol-backend

# ==============================================================
# DATASOURCE - Railway MySQL
# ==============================================================
# Railway provee estas variables automáticamente cuando agregas MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/railway}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==============================================================
# FLYWAY
# ==============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==============================================================
# SEGURIDAD JWT
# ==============================================================
# Usa variable de entorno en Railway (más seguro)
security.jwt.secret-key=${JWT_SECRET_KEY:KSH0F+fdP8e+RR/Jiv8MwbCMF2RGjyLEUrpJELoFEnI=}
security.jwt.expiration-time=${JWT_EXPIRATION:86400000}

# ==============================================================
# OPENAPI / SWAGGER
# ==============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================================================
# LOGGING - Producción
# ==============================================================
logging.level.root=INFO
logging.level.com.dulcecontrol=INFO

# ==============================================================
# ACTUATOR
# ==============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
