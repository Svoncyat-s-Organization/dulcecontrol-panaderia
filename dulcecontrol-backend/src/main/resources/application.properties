# ==============================================================
# SERVIDOR - Nos asignaron el rango de puertos
# ==============================================================
server.port=2250
# Muestra mensajes de error m\u00E1s detallados en desarrollo (desactivar en producci\u00F3n)
server.error.include-message=always

# ==============================================================
# NOMBRE DE LA APLICACI\u00D3N
# ==============================================================
spring.application.name=dulcecontrol-backend

# ==============================================================
# DATASOURCE (CONEXI\u00D3N A BASE DE DATOS MYSQL)
# ==============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_panaderia?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MY_DB_USER:root}
spring.datasource.password=${MY_DB_PASSWORD:Barc171024@.}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
# Usa 'none' porque Flyway se encarga de toda la estructura de BD.
# Deshabilitamos 'validate' porque MySQL 5.5 no soporta tipo JSON (fue introducido en MySQL 5.7.8)
spring.jpa.hibernate.ddl-auto=none
# Muestra las consultas SQL en la consola (\u00FAtil para depurar en desarrollo)
spring.jpa.show-sql=true
# Formatea el SQL para que sea m\u00E1s legible
spring.jpa.properties.hibernate.format_sql=true
# MySQLDialect de Hibernate 6 es compatible con MySQL 5.x y superiores
# No hay necesidad de especificar versiones espec\u00EDficas (MySQL55Dialect, MySQL57Dialect ya no existen en Hibernate 6)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Desactiva Open Session In View (buena pr\u00E1ctica para evitar problemas de rendimiento)
spring.jpa.open-in-view=false

# ==============================================================
# FLYWAY (MIGRACIONES DE BASE DE DATOS)
# ==============================================================
spring.flyway.enabled=true
# Si la base de datos ya existe y no est\u00E1 vac\u00EDa, esto permite a Flyway iniciar
spring.flyway.baseline-on-migrate=true
# Ubicaci\u00F3n de tus scripts SQL (V1__init.sql, V2__..., etc.)
spring.flyway.locations=classpath:db/migration

# ==============================================================
# SEGURIDAD JWT (Configuraci\u00F3n personalizada)
# ==============================================================
# \u00A1IMPORTANTE! Debes generar una clave secreta fuerte (m\u00EDnimo 256-bit para HS256).
# No uses esto en producci\u00F3n. Genera una con: openssl rand -base64 32
security.jwt.secret-key=KSH0F+fdP8e+RR/Jiv8MwbCMF2RGjyLEUrpJELoFEnI=
# Tiempo de expiraci\u00F3n del token en milisegundos (ej. 86400000 = 1 d\u00EDa)
security.jwt.expiration-time=86400000

# ==============================================================
# OPENAPI / SWAGGER (Documentaci\u00F3n API)
# ==============================================================
# Ruta para acceder a la interfaz visual de Swagger (ej. http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
# Ruta para el JSON de la definici\u00F3n de la API
springdoc.api-docs.path=/v3/api-docs

# ==============================================================
# LOGGING
# ==============================================================
# Nivel de log por defecto
logging.level.root=INFO
# Logs m\u00E1s detallados para tu propio c\u00F3digo (ajusta el paquete a tu proyecto)
logging.level.com.dulcecontrol=DEBUG
# Para ver los valores de los par\u00E1metros en las consultas SQL (\u00FAtil pero ruidoso)
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =============================================================
# ACTUATOR
# ============================================================
# Mapping para endpoints
management.endpoints.web.exposure.include=*

# ==============================================================
# SSL/HTTPS Configuration
# ==============================================================
# Certificado SSL de cPanel convertido a PKCS12
server.ssl.enabled=false
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=dulcecontrol2025
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat