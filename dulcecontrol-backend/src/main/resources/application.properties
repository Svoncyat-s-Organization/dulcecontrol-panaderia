# ==============================================================
# SERVIDOR
# ==============================================================
server.port=8080
# Muestra mensajes de error más detallados en desarrollo (desactivar en producción)
server.error.include-message=always

# ==============================================================
# NOMBRE DE LA APLICACIÓN
# ==============================================================
spring.application.name=dulcecontrol-backend

# ==============================================================
# DATASOURCE (CONEXIÓN A BASE DE DATOS MYSQL)
# ==============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/dulcecontrol_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MY_DB_USER:root}
spring.datasource.password=${MY_DB_PASSWORD:Barc171024@.}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
# Usa 'validate' para que Hibernate solo verifique que el esquema coincida con las entidades.
# NO uses 'update' ni 'create' porque Flyway se encargará de la estructura.
spring.jpa.hibernate.ddl-auto=validate
# Muestra las consultas SQL en la consola (útil para depurar en desarrollo)
spring.jpa.show-sql=true
# Formatea el SQL para que sea más legible
spring.jpa.properties.hibernate.format_sql=true
# Dialecto para MySQL 8 (asegura compatibilidad con funciones modernas)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Desactiva Open Session In View (buena práctica para evitar problemas de rendimiento)
spring.jpa.open-in-view=false

# ==============================================================
# FLYWAY (MIGRACIONES DE BASE DE DATOS)
# ==============================================================
spring.flyway.enabled=true
# Si la base de datos ya existe y no está vacía, esto permite a Flyway iniciar
spring.flyway.baseline-on-migrate=true
# Ubicación de tus scripts SQL (V1__init.sql, V2__..., etc.)
spring.flyway.locations=classpath:db/migration

# ==============================================================
# SEGURIDAD JWT (Configuración personalizada)
# ==============================================================
# ¡IMPORTANTE! Debes generar una clave secreta fuerte (mínimo 256-bit para HS256).
# No uses esto en producción. Genera una con: openssl rand -base64 32
security.jwt.secret-key=ColocaAquiUnaClaveSecretaMuyLargaYAleatoriaParaTuFirmaJWT12345
# Tiempo de expiración del token en milisegundos (ej. 86400000 = 1 día)
security.jwt.expiration-time=86400000

# ==============================================================
# OPENAPI / SWAGGER (Documentación API)
# ==============================================================
# Ruta para acceder a la interfaz visual de Swagger (ej. http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
# Ruta para el JSON de la definición de la API
springdoc.api-docs.path=/v3/api-docs

# ==============================================================
# LOGGING
# ==============================================================
# Nivel de log por defecto
logging.level.root=INFO
# Logs más detallados para tu propio código (ajusta el paquete a tu proyecto)
logging.level.com.dulcecontrol=DEBUG
# Para ver los valores de los parámetros en las consultas SQL (útil pero ruidoso)
# logging.level.org.hibernate.orm.jdbc.bind=TRACE