# =============================================================================
# DULCE CONTROL - Configuración de Aplicación
# =============================================================================

# Nombre de la aplicación
spring.application.name=DulceControl

# =============================================================================
# CONFIGURACIÓN DE BASE DE DATOS - PostgreSQL
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dulcecontrol_bd
spring.datasource.username=${POSTGRE_DB_USER:postgres}
spring.datasource.password=${POSTGRE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# =============================================================================
# CONFIGURACIÓN DE FLYWAY
# =============================================================================
# Habilitar Flyway
spring.flyway.enabled=true

# Ubicación de los scripts de migración
spring.flyway.locations=classpath:db/migration

# Esquema de la base de datos
spring.flyway.schemas=dulce_control

# Crear esquema si no existe
spring.flyway.create-schemas=true

# Baseline en primera ejecución (útil para bases existentes)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Validar migraciones en startup
spring.flyway.validate-on-migrate=true

# Tabla de control de Flyway
spring.flyway.table=flyway_schema_history

# Placeholder para scripts (opcional)
spring.flyway.placeholder-replacement=false

# =============================================================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# =============================================================================
# No crear/actualizar esquema automáticamente (Flyway lo hace)
# Cambiar a 'none' para evitar validación de tipos personalizados como CITEXT
spring.jpa.hibernate.ddl-auto=none

# Dialecto de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostrar SQL en logs (desarrollo)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Schema por defecto
spring.jpa.properties.hibernate.default_schema=dulce_control

# Desactivar validación del esquema para tipos personalizados de PostgreSQL (como CITEXT)
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none

# =============================================================================
# LOGGING
# =============================================================================
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE